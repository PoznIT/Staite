[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staite_mcp"
version = "0.1.0"
description = "MCP server for StAIte"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "starlette>=1.0.0",
    "sentence-transformers>=5.5.0",
    "chromadb>=1.5.9",
    "mcp>=1.27.1",
    "httpx>=0.28.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100