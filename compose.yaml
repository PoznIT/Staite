services:
  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # STATE.json lives here, written by staite run on the host.
      - ./.staite:/data
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    command:
      - serve
      - --state
      - /data/STATE.json
      - --transport
      - http
      - --port
      - "8080"
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
