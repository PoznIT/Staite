# staite.example.yaml — copy to staite.yml and adjust for your project
# Run: python -m staite --config staite.yml

project_name: staite-cli
provider: anthropic
anthropic:
  model: claude-haiku-4-5-20251001

# Glob patterns (gitignore syntax) for files to include
include:
  - src/**
  - pyproject.toml
  - "**.py"

# Patterns to exclude (applied after include)
exclude:
  - venv/**
  - tests/**
  - staite.egg-inf/**
  - .idea/**
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/.DS_Store"
  - node_modules/**
  - dist/**
  - build/**
  - "**/*.min.js"
  - "**/*.lock"

instructions: |
  This project is meant to generate a `STATE.json` file. 
  The user will use the cli in his own project to generate 
  - filesystem tree
  - usecase scenario of his project
  - description of each files
  - coding conventions

output: .staite/STATE.json
cache: .staite/cache.json
