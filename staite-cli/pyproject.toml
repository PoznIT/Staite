[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staite_cli"
version = "0.1.0"
description = "Generate a dense AI-readable project state snapshot for use as Claude chat context"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pathspec>=0.12",
    "aiofiles>=23.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "mcp>=1.0",
]
azure = [
    "azure-ai-inference>=1.0.0b9",
    "azure-identity>=1.16.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["staite_cli*"]

[project.scripts]
staite_cli = "staite_cli.cli:app"
